      <rect class="fpBar" x="172"  y="480" width="12" height="120" rx="6" style="animation-duration:1s;animation-delay:.48s"/>
      <rect class="fpBar" x="194"  y="480" width="12" height="120" rx="6" style="animation-duration:1.25s;animation-delay:.56s"/>
      <rect class="fpBar" x="216"  y="480" width="12" height="120" rx="6" style="animation-duration:.9s;animation-delay:.64s"/>
      <rect class="fpBar" x="238"  y="480" width="12" height="120" rx="6" style="animation-duration:1.45s;animation-delay:.72s"/>
      <rect class="fpBar" x="260"  y="480" width="12" height="120" rx="6" style="animation-duration:1.15s;animation-delay:.8s"/>
      <rect class="fpBar" x="282"  y="480" width="12" height="120" rx="6" style="animation-duration:1.3s;animation-delay:.88s"/>
      <rect class="fpBar" x="304"  y="480" width="12" height="120" rx="6" style="animation-duration:.98s;animation-delay:.96s"/>
      <rect class="fpBar" x="326"  y="480" width="12" height="120" rx="6" style="animation-duration:1.55s;animation-delay:1.04s"/>
      <rect class="fpBar" x="348"  y="480" width="12" height="120" rx="6" style="animation-duration:1.05s;animation-delay:1.12s"/>
      <rect class="fpBar" x="370"  y="480" width="12" height="120" rx="6" style="animation-duration:1.42s;animation-delay:1.2s"/>
      <rect class="fpBar" x="392"  y="480" width="12" height="120" rx="6" style="animation-duration:.92s;animation-delay:1.28s"/>
      <rect class="fpBar" x="414"  y="480" width="12" height="120" rx="6" style="animation-duration:1.32s;animation-delay:1.36s"/>
      <rect class="fpBar" x="436"  y="480" width="12" height="120" rx="6" style="animation-duration:1.12s;animation-delay:1.44s"/>
      <rect class="fpBar" x="458"  y="480" width="12" height="120" rx="6" style="animation-duration:1.5s;animation-delay:1.52s"/>
    </g>
    <g fill="url(#fpGradA)" opacity="0.45">
      <rect class="fpBar" x="700"  y="548" width="12" height="72" rx="6" style="animation-duration:1.2s;animation-delay:.1s"/>
      <rect class="fpBar" x="722"  y="548" width="12" height="72" rx="6" style="animation-duration:.95s;animation-delay:.2s"/>
      <rect class="fpBar" x="744"  y="548" width="12" height="72" rx="6" style="animation-duration:1.4s;animation-delay:.3s"/>
      <rect class="fpBar" x="766"  y="548" width="12" height="72" rx="6" style="animation-duration:1.05s;animation-delay:.4s"/>
      <rect class="fpBar" x="788"  y="548" width="12" height="72" rx="6" style="animation-duration:1.3s;animation-delay:.5s"/>
      <rect class="fpBar" x="810"  y="548" width="12" height="72" rx="6" style="animation-duration:.9s;animation-delay:.6s"/>
      <rect class="fpBar" x="832"  y="548" width="12" height="72" rx="6" style="animation-duration:1.45s;animation-delay:.7s"/>
      <rect class="fpBar" x="854"  y="548" width="12" height="72" rx="6" style="animation-duration:1.1s;animation-delay:.8s"/>
      <rect class="fpBar" x="876"  y="548" width="12" height="72" rx="6" style="animation-duration:1.35s;animation-delay:.9s"/>
      <rect class="fpBar" x="898"  y="548" width="12" height="72" rx="6" style="animation-duration:.98s;animation-delay:1s"/>
      <rect class="fpBar" x="920"  y="548" width="12" height="72" rx="6" style="animation-duration:1.25s;animation-delay:1.1s"/>
      <rect class="fpBar" x="942"  y="548" width="12" height="72" rx="6" style="animation-duration:1.5s;animation-delay:1.2s"/>
      <rect class="fpBar" x="964"  y="548" width="12" height="72" rx="6" style="animation-duration:1.02s;animation-delay:1.3s"/>
      <rect class="fpBar" x="986"  y="548" width="12" height="72" rx="6" style="animation-duration:1.38s;animation-delay:1.4s"/>
      <rect class="fpBar" x="1008" y="548" width="12" height="72" rx="6" style="animation-duration:.92s;animation-delay:1.5s"/>
      <rect class="fpBar" x="1030" y="548" width="12" height="72" rx="6" style="animation-duration:1.3s;animation-delay:1.6s"/>
      <rect class="fpBar" x="1052" y="548" width="12" height="72" rx="6" style="animation-duration:1.15s;animation-delay:1.7s"/>
      <rect class="fpBar" x="1074" y="548" width="12" height="72" rx="6" style="animation-duration:1.45s;animation-delay:1.8s"/>
      <rect class="fpBar" x="1096" y="548" width="12" height="72" rx="6" style="animation-duration:1s;animation-delay:1.9s"/>
      <rect class="fpBar" x="1118" y="548" width="12" height="72" rx="6" style="animation-duration:1.35s;animation-delay:2s"/>
      <rect class="fpBar" x="1140" y="548" width="12" height="72" rx="6" style="animation-duration:1.2s;animation-delay:2.1s"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="25.5" fill="none" stroke="#1E293B"/>
</svg>
