      .mbFloat { animation: mbFloat 6.5s ease-in-out infinite; }
      .mbFloat2 { animation: mbFloat 7.8s ease-in-out infinite; }
      .mbFloat3 { animation: mbFloat 7.1s ease-in-out infinite; }
      .mbBlink { animation: mbBlink 2.3s ease-in-out infinite; }
      .mbRing { transform-box: fill-box; transform-origin: 50% 50%; animation: mbRing 2.7s ease-out infinite; }
      .mbAmb { animation: mbAmb 15s ease-in-out infinite; }
