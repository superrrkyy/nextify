<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Player layar penuh Nextify dengan lirik dan visualizer">
  <title>Nextify — Player layar penuh: visualizer, lirik, dan antrean</title>
  <defs>
    <linearGradient id="fpGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <linearGradient id="fpArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D9A9"/>
      <stop offset="0.45" stop-color="#155E75"/>
      <stop offset="1" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="fpFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B14" stop-opacity="0"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="fpGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38D9A9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38D9A9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fpGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="fpBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="fpFrame"><rect x="0" y="0" width="1200" height="620" rx="26"/></clipPath>
    <clipPath id="fpArtClip"><rect x="120" y="120" width="300" height="300" rx="26"/></clipPath>
    <style><![CDATA[
      .fpF { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      @keyframes fpBar   { 0%,100% { transform: scaleY(0.12); } 50% { transform: scaleY(1); } }
      @keyframes fpFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes fpAmb   { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-24px) scale(1.12); } }
      @keyframes fpAmb2  { 0%,100% { transform: translate(0,0) scale(1.08); } 50% { transform: translate(-32px,20px) scale(0.9); } }
      @keyframes fpRing  { 0% { transform: scale(0.86); opacity: 0.5; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes fpLyric { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .fpBar { transform-box: fill-box; transform-origin: 50% 100%; animation: fpBar 1.15s ease-in-out infinite; }
      .fpFloat { animation: fpFloat 7.5s ease-in-out infinite; }
      .fpAmb  { animation: fpAmb 16s ease-in-out infinite; }
      .fpAmb2 { animation: fpAmb2 20s ease-in-out infinite; }
      .fpRing { transform-box: fill-box; transform-origin: 50% 50%; animation: fpRing 2.8s ease-out infinite; }
      .fpLyric { animation: fpLyric 3.2s ease-in-out infinite; }
    ]]></style>
  </defs>

  <g clip-path="url(#fpFrame)">
    <rect width="1200" height="620" fill="#070B14"/>
    <circle class="fpAmb" cx="270" cy="270" r="300" fill="url(#fpGlow1)"/>
    <circle class="fpAmb2" cx="1000" cy="360" r="320" fill="url(#fpGlow2)"/>
    <rect x="0" y="440" width="1200" height="180" fill="url(#fpFade)"/>

    <!-- top bar -->
    <path d="M52 56l-10 10 10 10" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text class="fpF" x="600" y="66" font-size="11.5" font-weight="700" letter-spacing="3" fill="#94A3B8" text-anchor="middle">DIPUTAR DARI — ETERNAL ECHOES</text>
    <g fill="none" stroke="#94A3B8" stroke-width="2">
      <path d="M1116 56h24M1116 66h24M1116 76h24"/>
    </g>

    <!-- ===== Artwork ===== -->
    <g class="fpFloat">
      <rect x="140" y="140" width="280" height="280" rx="26" fill="#000000" opacity="0.55" filter="url(#fpBlur)"/>
      <rect x="120" y="120" width="300" height="300" rx="26" fill="url(#fpArt)" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <g clip-path="url(#fpArtClip)" stroke="#63F5C2" fill="none">
        <circle cx="270" cy="270" r="42" stroke-width="2.4" stroke-opacity="0.9"/>
        <circle cx="270" cy="270" r="72" stroke-width="1.8" stroke-opacity="0.55"/>
        <circle cx="270" cy="270" r="102" stroke-width="1.5" stroke-opacity="0.35"/>
        <circle cx="270" cy="270" r="132" stroke-width="1.3" stroke-opacity="0.2"/>
      </g>
      <circle cx="270" cy="270" r="13" fill="#070B14"/>
      <circle cx="270" cy="270" r="4" fill="#63F5C2"/>
    </g>

    <!-- ===== Track info ===== -->
    <text class="fpF" x="492" y="164" font-size="13" font-weight="700" letter-spacing="2.8" fill="#63F5C2">LUNA ECHO</text>
    <text class="fpF" x="492" y="212" font-size="40" font-weight="800" fill="#F8FAFC">Midnight City Lights</text>
    <text class="fpF" x="492" y="244" font-size="15.5" fill="#94A3B8">Eternal Echoes · 2024 · 3:35</text>

    <rect x="492" y="264" width="60" height="26" rx="13" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/>
    <text class="fpF" x="522" y="282" font-size="11" font-weight="700" letter-spacing="1.6" fill="#63F5C2" text-anchor="middle">POP</text>
    <rect x="560" y="264" width="34" height="26" rx="8" fill="#94A3B8" fill-opacity="0.16" stroke="#94A3B8" stroke-opacity="0.3"/>
    <text class="fpF" x="577" y="282" font-size="11" font-weight="800" fill="#CBD5E1" text-anchor="middle">E</text>
    <rect x="602" y="264" width="150" height="26" rx="13" fill="#111827" stroke="#1E293B"/>
    <text class="fpF" x="677" y="282" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94A3B8" text-anchor="middle">downloadAllowed: true</text>

    <!-- progress -->
    <text class="fpF" x="492" y="336" font-size="13" fill="#94A3B8">1:12</text>
    <rect x="540" y="330" width="560" height="6" rx="3" fill="#1E293B"/>
    <rect x="540" y="330" width="0" height="6" rx="3" fill="url(#fpGradA)">
      <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.86;0.97;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <circle cy="333" cx="540" r="8" fill="#63F5C2">
      <animate attributeName="cx" values="540;1100;1100;540" keyTimes="0;0.86;0.97;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text class="fpF" x="1116" y="336" font-size="13" fill="#94A3B8" text-anchor="end">3:35</text>

    <!-- controls -->
    <g fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M542 374h5l11 12h10"/>
      <path d="M542 392h5l11-12h10"/>
      <path d="M564 370l4 4-4 4"/>
      <path d="M564 388l4 4-4 4"/>
      <path d="M1042 374h9a6 6 0 0 1 6 6v1"/>
      <path d="M1061 392h-9a6 6 0 0 1-6-6v-1"/>
      <path d="M1053 369l4 4-4 4"/>
      <path d="M1053 395l4-4-4-4"/>
    </g>
    <g fill="#CBD5E1">
      <path d="M656 394v-24l-18 12z M636 370h-4v24h4z"/>
      <path d="M964 370v24l18-12z M984 370h4v24h-4z"/>
    </g>
    <circle class="fpRing" cx="810" cy="382" r="34" fill="none" stroke="#63F5C2" stroke-width="2"/>
    <circle cx="810" cy="382" r="34" fill="url(#fpGradA)"/>
    <path d="M800 369v26l22-13z" fill="#070B14"/>

    <!-- ===== Lyrics panel ===== -->
    <rect x="492" y="420" width="624" height="120" rx="18" fill="#0D1322" stroke="#1E293B"/>
    <text class="fpF" x="516" y="446" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#64748B">LIRIK</text>
    <g class="fpF" font-size="14">
      <text x="516" y="474" fill="#64748B">City lights are fading in the rain…</text>
      <text class="fpLyric" x="516" y="500" font-size="16" font-weight="700" fill="#63F5C2">We drive until the neon finds our names</text>
      <text x="516" y="526" fill="#64748B">Hold on tight, the midnight never ends…</text>
    </g>
    <rect x="1080" y="436" width="18" height="90" rx="9" fill="#1E293B"/>
    <rect x="1080" y="470" width="18" height="36" rx="9" fill="#63F5C2" fill-opacity="0.6"/>

    <!-- ===== Visualizer ===== -->
    <g fill="url(#fpGradA)" opacity="0.85">
      <rect class="fpBar" x="40"   y="480" width="12" height="120" rx="6"/>
      <rect class="fpBar" x="62"   y="480" width="12" height="120" rx="6" style="animation-duration:1.35s;animation-delay:.08s"/>
      <rect class="fpBar" x="84"   y="480" width="12" height="120" rx="6" style="animation-duration:.95s;animation-delay:.16s"/>
