version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nextify
      POSTGRES_PASSWORD: nextify_password
      POSTGRES_DB: nextify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextify"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextify:nextify_password@postgres:5432/nextify?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production-32chars
      JWT_REFRESH_SECRET: super-secret-refresh-key-change-in-production-32chars
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/prisma:/app/prisma

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:4000/api

volumes:
  postgres_data:
