      @keyframes mbFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes mbBlink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes mbRing  { 0% { transform: scale(.88); opacity: .5; } 100% { transform: scale(1.65); opacity: 0; } }
      @keyframes mbAmb   { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(22px,-16px) scale(1.1); } }
