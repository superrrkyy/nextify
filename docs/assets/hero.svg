<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Nextify — platform streaming musik premium">
  <title>Nextify — Your Sound. Your Era. Your Nextify.</title>
  <defs>
    <linearGradient id="nxGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <linearGradient id="nxGradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <linearGradient id="nxGradArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D9A9"/>
      <stop offset="0.5" stop-color="#123A57"/>
      <stop offset="1" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="nxGradCard" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="1" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="nxGradChip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63F5C2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38D9A9" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="nxGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38D9A9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38D9A9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nxGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nxDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#63F5C2" fill-opacity="0.13"/>
    </pattern>
    <filter id="nxSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="nxFrame"><rect x="0" y="0" width="1200" height="520" rx="28"/></clipPath>
    <clipPath id="nxClipCard"><rect x="690" y="92" width="424" height="336" rx="28"/></clipPath>
    <clipPath id="nxClipMarquee"><rect x="0" y="436" width="1200" height="60"/></clipPath>
    <style><![CDATA[
      .nxF { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      @keyframes nxAmbient  { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(26px,-20px) scale(1.1); } }
      @keyframes nxAmbient2 { 0%,100% { transform: translate(0,0) scale(1.06); } 50% { transform: translate(-28px,16px) scale(0.93); } }
      @keyframes nxFloat    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }
      @keyframes nxRing     { 0% { transform: scale(0.82); opacity: 0.55; } 100% { transform: scale(1.55); opacity: 0; } }
      @keyframes nxBar      { 0%,100% { transform: scaleY(0.2); } 50% { transform: scaleY(1); } }
      @keyframes nxNote     { 0% { transform: translate(0,0) rotate(0deg); opacity: 0; } 14% { opacity: 0.85; } 100% { transform: translate(-44px,-180px) rotate(-20deg); opacity: 0; } }
      @keyframes nxMarquee  { 0% { transform: translateX(0); } 100% { transform: translateX(-1200px); } }
      @keyframes nxSheen    { 0% { transform: translateX(-260px); } 100% { transform: translateX(440px); } }
      .nxAmb1 { animation: nxAmbient 15s ease-in-out infinite; }
      .nxAmb2 { animation: nxAmbient2 19s ease-in-out infinite; }
      .nxFloat { animation: nxFloat 7s ease-in-out infinite; }
      .nxFloatSlow { animation: nxFloat 9.5s ease-in-out infinite; }
      .nxRing { animation: nxRing 2.8s ease-out infinite; transform-origin: 118px 112px; }
      .nxRing2 { animation-delay: 1.4s; }
      .nxEq { transform-box: fill-box; transform-origin: 50% 100%; animation: nxBar 1.1s ease-in-out infinite; }
      .nxMarquee { animation: nxMarquee 40s linear infinite; }
      .nxSheen { animation: nxSheen 7s ease-in-out infinite; }
      .nxNote { animation: nxNote 6.5s linear infinite; }
    ]]></style>
  </defs>

  <g clip-path="url(#nxFrame)">
    <!-- ===== Background ===== -->
    <rect width="1200" height="520" fill="#070B14"/>
    <rect width="1200" height="520" fill="url(#nxDots)"/>
    <circle class="nxAmb1" cx="250" cy="130" r="260" fill="url(#nxGlow1)"/>
    <circle class="nxAmb2" cx="985" cy="420" r="300" fill="url(#nxGlow2)"/>
    <circle class="nxAmb2" cx="640" cy="60" r="200" fill="url(#nxGlow1)" opacity="0.5"/>

    <!-- ===== Logo + Wordmark ===== -->
    <circle class="nxRing" cx="118" cy="112" r="34" fill="none" stroke="#63F5C2" stroke-width="2"/>
    <circle class="nxRing nxRing2" cx="118" cy="112" r="34" fill="none" stroke="#63F5C2" stroke-width="2"/>
    <rect x="84" y="78" width="68" height="68" rx="20" fill="url(#nxGradA)"/>
    <path d="M110 96.5v31l24-15.5-24-15.5z" fill="#070B14"/>
    <rect x="84" y="78" width="68" height="68" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"/>

    <text class="nxF" x="176" y="134" font-size="70" font-weight="800" letter-spacing="9" fill="url(#nxGradText)">NEXTIFY</text>
    <rect x="178" y="156" width="258" height="26" rx="13" fill="url(#nxGradChip)" stroke="#63F5C2" stroke-opacity="0.32"/>
    <text class="nxF" x="307" y="173" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="#63F5C2" text-anchor="middle">PREMIUM MUSIC PLATFORM</text>

    <text class="nxF" x="86" y="250" font-size="27" font-weight="600" fill="#F8FAFC">Your Sound. Your Era. Your Nextify.</text>
    <text class="nxF" x="86" y="282" font-size="15.5" fill="#94A3B8">Streaming musik full-stack — React · Express · Prisma · PWA</text>

    <!-- ===== Stat pills ===== -->
    <g class="nxFloatSlow">
      <rect x="86" y="316" width="128" height="46" rx="14" fill="#111827" stroke="#1E293B"/>
      <text class="nxF" x="106" y="338" font-size="17" font-weight="800" fill="#63F5C2">14</text>
      <text class="nxF" x="106" y="354" font-size="11.5" fill="#94A3B8" letter-spacing="0.6">GENRE</text>

      <rect x="226" y="316" width="128" height="46" rx="14" fill="#111827" stroke="#1E293B"/>
      <text class="nxF" x="246" y="338" font-size="17" font-weight="800" fill="#63F5C2">15</text>
      <text class="nxF" x="246" y="354" font-size="11.5" fill="#94A3B8" letter-spacing="0.6">ARTIS</text>

      <rect x="366" y="316" width="128" height="46" rx="14" fill="#111827" stroke="#1E293B"/>
      <text class="nxF" x="386" y="338" font-size="17" font-weight="800" fill="#63F5C2">14</text>
      <text class="nxF" x="386" y="354" font-size="11.5" fill="#94A3B8" letter-spacing="0.6">ALBUM</text>

      <rect x="506" y="316" width="128" height="46" rx="14" fill="#111827" stroke="#1E293B"/>
      <text class="nxF" x="526" y="338" font-size="17" font-weight="800" fill="#63F5C2">30</text>
      <text class="nxF" x="526" y="354" font-size="11.5" fill="#94A3B8" letter-spacing="0.6">TRACK</text>
    </g>

    <!-- ===== Floating notes ===== -->
    <g fill="none" stroke="#63F5C2" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.8">
      <g class="nxNote"><path d="M612 402v-26l16-4v26"/><circle cx="608" cy="403" r="5.4" fill="#63F5C2" stroke="none"/><circle cx="624" cy="399" r="5.4" fill="#63F5C2" stroke="none"/></g>
      <g class="nxNote" style="animation-delay:2.1s"><path d="M650 420v-22"/><circle cx="646" cy="421" r="5" fill="#63F5C2" stroke="none"/></g>
      <g class="nxNote" style="animation-delay:3.9s"><path d="M578 430v-22"/><circle cx="574" cy="431" r="5" fill="#63F5C2" stroke="none"/></g>
    </g>

    <!-- ===== Now Playing card ===== -->
    <g class="nxFloat">
      <rect x="704" y="112" width="396" height="308" rx="26" fill="#000000" opacity="0.5" filter="url(#nxSoft)"/>
      <rect x="690" y="92" width="424" height="336" rx="28" fill="url(#nxGradCard)" stroke="#1E293B" stroke-width="1.5"/>
      <g clip-path="url(#nxClipCard)">
        <circle cx="1130" cy="110" r="130" fill="url(#nxGlow1)" opacity="0.6"/>
        <rect class="nxSheen" x="690" y="92" width="80" height="336" fill="#FFFFFF" opacity="0.045"/>
      </g>

      <circle cx="716" cy="122" r="4.5" fill="#63F5C2"/>
      <text class="nxF" x="732" y="127" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#94A3B8">SEDANG DIPUTAR</text>

      <rect x="716" y="146" width="104" height="104" rx="20" fill="url(#nxGradArt)"/>
      <g stroke="#63F5C2" fill="none">
        <circle cx="768" cy="198" r="12" stroke-width="2" stroke-opacity="0.85"/>
        <circle cx="768" cy="198" r="24" stroke-width="1.6" stroke-opacity="0.5"/>
        <circle cx="768" cy="198" r="36" stroke-width="1.4" stroke-opacity="0.28"/>
      </g>
      <circle cx="768" cy="198" r="4.5" fill="#070B14"/>
      <rect x="716" y="146" width="104" height="104" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>

      <text class="nxF" x="840" y="182" font-size="21" font-weight="700" fill="#F8FAFC">Midnight City Lights</text>
      <text class="nxF" x="840" y="208" font-size="14.5" fill="#94A3B8">Luna Echo — Eternal Echoes</text>
      <rect x="840" y="222" width="58" height="22" rx="11" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/>
      <text class="nxF" x="869" y="237" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#63F5C2" text-anchor="middle">POP</text>
      <rect x="906" y="222" width="104" height="22" rx="11" fill="#111827" stroke="#1E293B"/>
      <text class="nxF" x="958" y="237" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8" text-anchor="middle">HQ 320 KBPS</text>

      <g fill="#63F5C2">
        <rect class="nxEq" x="1046" y="196" width="6" height="38" rx="3"/>
        <rect class="nxEq" x="1058" y="196" width="6" height="38" rx="3" style="animation-delay:0.12s"/>
        <rect class="nxEq" x="1070" y="196" width="6" height="38" rx="3" style="animation-delay:0.28s"/>
        <rect class="nxEq" x="1082" y="196" width="6" height="38" rx="3" style="animation-delay:0.44s"/>
      </g>

      <rect x="716" y="288" width="372" height="6" rx="3" fill="#1E293B"/>
      <rect x="716" y="288" width="0" height="6" rx="3" fill="url(#nxGradA)">
        <animate attributeName="width" values="0;372;372;0" keyTimes="0;0.86;0.97;1" dur="11s" repeatCount="indefinite"/>
      </rect>
      <circle cy="291" cx="716" r="7" fill="#63F5C2">
        <animate attributeName="cx" values="716;1088;1088;716" keyTimes="0;0.86;0.97;1" dur="11s" repeatCount="indefinite"/>
      </circle>
      <text class="nxF" x="716" y="316" font-size="12" fill="#94A3B8">1:12</text>
      <text class="nxF" x="1088" y="316" font-size="12" fill="#94A3B8" text-anchor="end">3:35</text>

      <path d="M866 366v-18l-13 9z M851 348h-3v18h3z" fill="#94A3B8"/>
      <circle cx="902" cy="357" r="23" fill="url(#nxGradA)"/>
      <circle cx="902" cy="357" r="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <path d="M895 347.5v19l16-9.5z" fill="#070B14"/>
      <path d="M938 348v18l13-9z M953 348h3v18h-3z" fill="#94A3B8"/>
    </g>

    <!-- ===== Genre marquee ===== -->
    <g clip-path="url(#nxClipMarquee)">
      <g class="nxMarquee">
        <g class="nxF" font-size="13" font-weight="600" fill="#94A3B8">
          <rect x="0" y="452" width="62" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="31" y="472" text-anchor="middle">Pop</text>
          <rect x="74" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="107" y="472" text-anchor="middle">Rock</text>
          <rect x="152" y="452" width="88" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="196" y="472" text-anchor="middle">Hip-Hop</text>
          <rect x="252" y="452" width="100" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="302" y="472" text-anchor="middle">Electronic</text>
          <rect x="364" y="452" width="64" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="396" y="472" text-anchor="middle">Chill</text>
          <rect x="440" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="473" y="472" text-anchor="middle">Lo-Fi</text>
          <rect x="518" y="452" width="108" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="572" y="472" text-anchor="middle">Instrumental</text>
          <rect x="638" y="452" width="88" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="682" y="472" text-anchor="middle">Workout</text>
          <rect x="738" y="452" width="96" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="786" y="472" text-anchor="middle">Romantic</text>
          <rect x="846" y="452" width="70" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="881" y="472" text-anchor="middle">Focus</text>
          <rect x="928" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="961" y="472" text-anchor="middle">Sleep</text>
          <rect x="1006" y="452" width="60" height="30" rx="15" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/><text x="1036" y="472" text-anchor="middle" fill="#63F5C2">80s</text>
          <rect x="1078" y="452" width="60" height="30" rx="15" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/><text x="1108" y="472" text-anchor="middle" fill="#63F5C2">90s</text>
        </g>
        <g class="nxF" font-size="13" font-weight="600" fill="#94A3B8" transform="translate(1200,0)">
          <rect x="0" y="452" width="62" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="31" y="472" text-anchor="middle">Pop</text>
          <rect x="74" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="107" y="472" text-anchor="middle">Rock</text>
          <rect x="152" y="452" width="88" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="196" y="472" text-anchor="middle">Hip-Hop</text>
          <rect x="252" y="452" width="100" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="302" y="472" text-anchor="middle">Electronic</text>
          <rect x="364" y="452" width="64" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="396" y="472" text-anchor="middle">Chill</text>
          <rect x="440" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="473" y="472" text-anchor="middle">Lo-Fi</text>
          <rect x="518" y="452" width="108" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="572" y="472" text-anchor="middle">Instrumental</text>
          <rect x="638" y="452" width="88" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="682" y="472" text-anchor="middle">Workout</text>
          <rect x="738" y="452" width="96" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="786" y="472" text-anchor="middle">Romantic</text>
          <rect x="846" y="452" width="70" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="881" y="472" text-anchor="middle">Focus</text>
          <rect x="928" y="452" width="66" height="30" rx="15" fill="#111827" stroke="#1E293B"/><text x="961" y="472" text-anchor="middle">Sleep</text>
          <rect x="1006" y="452" width="60" height="30" rx="15" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/><text x="1036" y="472" text-anchor="middle" fill="#63F5C2">80s</text>
          <rect x="1078" y="452" width="60" height="30" rx="15" fill="#63F5C2" fill-opacity="0.14" stroke="#63F5C2" stroke-opacity="0.35"/><text x="1108" y="472" text-anchor="middle" fill="#63F5C2">90s</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="27.5" fill="none" stroke="#1E293B"/>
  <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="27.5" fill="none" stroke="url(#nxGradA)" stroke-opacity="0.22"/>
</svg>
