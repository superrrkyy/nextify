<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Antarmuka halaman beranda Nextify">
  <title>Nextify — Beranda, daftar trending, dan player persisten</title>
  <defs>
    <linearGradient id="hmGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <linearGradient id="hmHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123C4A"/>
      <stop offset="0.55" stop-color="#123146"/>
      <stop offset="1" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="hmArt1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38D9A9"/><stop offset="1" stop-color="#0E7490"/></linearGradient>
    <linearGradient id="hmArt2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
    <linearGradient id="hmArt3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#7C2D12"/></linearGradient>
    <linearGradient id="hmArt4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="hmArt5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#831843"/></linearGradient>
    <linearGradient id="hmArt6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#065F46"/></linearGradient>
    <radialGradient id="hmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38D9A9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38D9A9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hmFrame"><rect x="0" y="0" width="1200" height="720" rx="26"/></clipPath>
    <clipPath id="hmHeroClip"><rect x="276" y="124" width="888" height="152" rx="22"/></clipPath>
    <style><![CDATA[
      .hmF { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      @keyframes hmEq   { 0%,100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
      @keyframes hmSheen{ 0% { transform: translateX(-300px); } 100% { transform: translateX(980px); } }
      @keyframes hmSpin { to { transform: rotate(360deg); } }
      @keyframes hmBlink{ 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes hmRing { 0% { transform: scale(0.9); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }
      @keyframes hmFade { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .hmEq { transform-box: fill-box; transform-origin: 50% 100%; animation: hmEq 1s ease-in-out infinite; }
      .hmSheen { animation: hmSheen 9s ease-in-out infinite; }
      .hmSpin { transform-box: fill-box; transform-origin: 50% 50%; animation: hmSpin 14s linear infinite; }
      .hmBlink { animation: hmBlink 2.4s ease-in-out infinite; }
      .hmRing { transform-box: fill-box; transform-origin: 50% 50%; animation: hmRing 2.6s ease-out infinite; }
      .hmFade { animation: hmFade 5s ease-in-out infinite; }
    ]]></style>
  </defs>

