      <text x="826" y="439" text-anchor="end">3:07</text>

      <text x="294" y="485" font-size="13" font-weight="700" fill="#64748B">4</text>
      <rect x="318" y="465" width="30" height="30" rx="8" fill="url(#hmArt4)"/>
      <text x="360" y="478" font-weight="600" fill="#F8FAFC">Golden Hour Glow</text>
      <text x="360" y="494" font-size="11.5">Ava Sterling</text>
      <text x="826" y="485" text-anchor="end">3:23</text>

      <text x="294" y="531" font-size="13" font-weight="700" fill="#64748B">5</text>
