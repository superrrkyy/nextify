      <text class="hmF" x="1030" y="412" font-size="12" font-weight="600" fill="#F8FAFC">Neon Nights</text>
      <text class="hmF" x="1030" y="428" font-size="10.5" fill="#94A3B8">Electronic</text>

      <rect x="860" y="450" width="146" height="118" rx="14" fill="#111827" stroke="#1E293B"/>
      <rect x="860" y="450" width="146" height="72" rx="14" fill="url(#hmArt3)"/>
      <text class="hmF" x="874" y="542" font-size="12" font-weight="600" fill="#F8FAFC">Workout Energy</text>
      <text class="hmF" x="874" y="558" font-size="10.5" fill="#94A3B8">High energy</text>

      <rect x="1016" y="450" width="146" height="118" rx="14" fill="#111827" stroke="#1E293B"/>
      <rect x="1016" y="450" width="146" height="72" rx="14" fill="url(#hmArt4)"/>
      <text class="hmF" x="1030" y="542" font-size="12" font-weight="600" fill="#F8FAFC">80s Essentials</text>
      <text class="hmF" x="1030" y="558" font-size="10.5" fill="#94A3B8">Nostalgia</text>
