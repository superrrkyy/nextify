<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Dibuat dengan cinta untuk pecinta musik — Nextify">
  <title>Dibuat dengan ♥ untuk pecinta musik</title>
  <defs>
    <linearGradient id="ftGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <linearGradient id="ftGradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#63F5C2"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
    <radialGradient id="ftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38D9A9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38D9A9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ftFrame"><rect x="0" y="0" width="1200" height="240" rx="24"/></clipPath>
    <style><![CDATA[
      .ftF { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      @keyframes ftBeat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.22); } 24% { transform: scale(1); } 36% { transform: scale(1.14); } 50% { transform: scale(1); } }
      @keyframes ftEq   { 0%,100% { transform: scaleY(0.2); } 50% { transform: scaleY(1); } }
      @keyframes ftAmb   { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-14px) scale(1.1); } }
      .ftBeat { transform-box: fill-box; transform-origin: 50% 50%; animation: ftBeat 2.2s ease-in-out infinite; }
      .ftEq { transform-box: fill-box; transform-origin: 50% 100%; animation: ftEq 1.15s ease-in-out infinite; }
      .ftAmb { animation: ftAmb 17s ease-in-out infinite; }
    ]]></style>
  </defs>

  <g clip-path="url(#ftFrame)">
    <rect width="1200" height="240" fill="#070B14"/>
    <circle class="ftAmb" cx="600" cy="130" r="330" fill="url(#ftGlow)"/>

    <g fill="url(#ftGradA)" opacity="0.55">
      <rect class="ftEq" x="120" y="170" width="5" height="34" rx="2.5"/>
      <rect class="ftEq" x="133" y="170" width="5" height="34" rx="2.5" style="animation-delay:.1s"/>
      <rect class="ftEq" x="146" y="170" width="5" height="34" rx="2.5" style="animation-delay:.2s"/>
      <rect class="ftEq" x="159" y="170" width="5" height="34" rx="2.5" style="animation-delay:.3s"/>
      <rect class="ftEq" x="1036" y="170" width="5" height="34" rx="2.5" style="animation-delay:.15s"/>
      <rect class="ftEq" x="1049" y="170" width="5" height="34" rx="2.5" style="animation-delay:.25s"/>
      <rect class="ftEq" x="1062" y="170" width="5" height="34" rx="2.5" style="animation-delay:.35s"/>
      <rect class="ftEq" x="1075" y="170" width="5" height="34" rx="2.5" style="animation-delay:.45s"/>
    </g>

    <g class="ftBeat">
      <path d="M600 74c-10-14-34-10-34 8 0 15 18 24 34 36 16-12 34-21 34-36 0-18-24-22-34-8z" fill="#63F5C2"/>
    </g>

    <text class="ftF" x="600" y="150" font-size="27" font-weight="700" fill="#F8FAFC" text-anchor="middle">Dibuat dengan <tspan fill="#63F5C2">♥</tspan> untuk pecinta musik</text>
    <text class="ftF" x="600" y="184" font-size="19" font-weight="600" letter-spacing="0.6" fill="url(#ftGradText)" text-anchor="middle">Your Sound. Your Era. Your Nextify.</text>
    <text class="ftF" x="600" y="212" font-size="12.5" fill="#64748B" text-anchor="middle" letter-spacing="1.4">LISENSI MIT · NEXTIFY v1.0.0</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="23.5" fill="none" stroke="#1E293B"/>
</svg>
