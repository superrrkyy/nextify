    <circle class="hmBlink" cx="298" cy="598" r="4" fill="#63F5C2"/>
    <text class="hmF" x="312" y="603" font-size="12" fill="#94A3B8">Antrean: 12 lagu · shuffle aktif · repeat all · pintasan keyboard: Spasi, ←/→, ↑/↓, Shift+←/→</text>

    <!-- ===== Player bar ===== -->
    <rect x="12" y="640" width="1176" height="68" rx="18" fill="#111827" stroke="#1E293B"/>
    <rect x="32" y="654" width="40" height="40" rx="10" fill="url(#hmArt1)"/>
    <text class="hmF" x="86" y="670" font-size="13" font-weight="600" fill="#F8FAFC">Midnight City Lights</text>
